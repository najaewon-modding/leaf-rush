name: Release

on:
  push:
    branches: [main]
    paths:
      - 'gradle.properties'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          MOD_VERSION="$(sed -n 's/^mod_version=//p' gradle.properties)"
          MINECRAFT_VERSION="$(sed -n 's/^minecraft_version=//p' gradle.properties)"
          MOD_ID="$(sed -n 's/^mod_id=//p' gradle.properties)"
          if [ -z "$MOD_VERSION" ] || [ -z "$MINECRAFT_VERSION" ] || [ -z "$MOD_ID" ]; then
            echo 'Missing mod_version, minecraft_version, or mod_id in gradle.properties.'
            exit 1
          fi
          if [[ "$MOD_VERSION" != *"-mc${MINECRAFT_VERSION}" ]]; then
            echo "mod_version must end with -mc${MINECRAFT_VERSION}; got ${MOD_VERSION}."
            exit 1
          fi
          TAG="v${MOD_VERSION}"
          echo "version=$MOD_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "jar=build/libs/${MOD_ID}-${MOD_VERSION}.jar" >> "$GITHUB_OUTPUT"

      - name: Check existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; skipping."
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.existing.outputs.exists == 'false'
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: Verify release JAR
        if: steps.existing.outputs.exists == 'false'
        env:
          JAR: ${{ steps.version.outputs.jar }}
        shell: bash
        run: |
          test -f "$JAR" || { echo "Expected release JAR not found: $JAR"; exit 1; }

      - name: Create GitHub Release
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          JAR: ${{ steps.version.outputs.jar }}
        shell: bash
        run: |
          gh release create "$TAG" "$JAR" \
            --target "$GITHUB_SHA" \
            --title "Leaf Rush $VERSION" \
            --generate-notes

      - name: Publish to CurseForge
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: gh workflow run publish-curseforge.yml -f tag="$TAG"
